{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="row justify-content-center login-page">
  <div class="col-sm-10 col-md-8 col-lg-5 col-xl-4 login-col">
    <div class="card login-card border-0">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4 login-brand">
          <img
            src="{{ url_for('static', filename='assets/logo.png') }}"
            alt="琴岳 Logo"
            class="login-logo mb-3"
          >
          <h2 class="h4 mb-1">创建琴岳账号</h2>
          <p class="text-muted mb-0">注册后可使用客户端工作台</p>
        </div>
        <form method="post" class="login-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="username" class="form-label">用户名/手机号</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="可填写用户名/11位手机号" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">密码</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <div class="mb-4">
            <label for="confirm_password" class="form-label">确认密码</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">注册</button>
          <p class="text-center mt-3 mb-0 text-muted">
            已有账号？
            <a href="{{ url_for('auth.login') }}" class="text-decoration-none">去登录</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
