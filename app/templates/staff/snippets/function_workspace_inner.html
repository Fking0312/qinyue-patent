<div class="staff-page-inner p-3 p-md-4">
  <header class="d-flex flex-column gap-1 pb-3 mb-3 mb-md-4 border-bottom border-secondary-subtle">
    <h1 class="h4 mb-0 staff-page-title">{{ page_title }}</h1>
    <p class="text-muted small mb-0">{{ page_desc }}</p>
  </header>

  <div class="row g-3">
    {% for card in placeholder_cards %}
    <div class="col-12 col-md-6">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex flex-column">
          <div class="d-flex align-items-start justify-content-between gap-2 mb-2">
            <h2 class="h6 mb-0">{{ card.title }}</h2>
            <span class="badge text-bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle">功能建设中</span>
          </div>
          <p class="text-muted small mb-0 flex-grow-1">{{ card.desc }}</p>
          {% if card.endpoint %}
          <div class="mt-3">
            <a class="btn btn-sm btn-outline-primary" href="{{ url_for(card.endpoint) }}" data-spa-endpoint="{{ card.endpoint }}">进入入口</a>
          </div>
          {% endif %}
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
